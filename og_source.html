<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
.card{
  width:1200px;height:630px;display:flex;align-items:center;gap:60px;padding:0 80px;
  background:
    radial-gradient(circle at 88% 12%, rgba(41,171,226,.22), transparent 45%),
    radial-gradient(circle at 5% 95%, rgba(242,101,34,.12), transparent 40%),
    linear-gradient(160deg,#0C2545 0%,#081B31 55%,#061323 100%);
}
img{width:330px;border-radius:26px;box-shadow:0 0 70px rgba(41,171,226,.45);flex-shrink:0}
h1{color:#fff;font-size:66px;font-weight:800;line-height:1.12;letter-spacing:-1px}
h1 .c{color:#29ABE2}
.tag{color:#BFD4E6;font-size:34px;margin-top:26px;line-height:1.4}
.tag b{color:#F7931E}
.rule{width:120px;height:6px;background:#F7931E;border-radius:3px;margin:30px 0 24px}
.dom{color:#6FA9CE;font-size:27px;letter-spacing:5px;font-weight:600}
</style></head><body>
<div class="card">
  <img src="file:///C:/Users/giagi/Desktop/DIA/Sito/logo.jpg">
  <div>
    <h1>DRONE <span class="c">INTELLIGENCE</span><br>ACADEMY</h1>
    <div class="rule"></div>
    <div class="tag">Il drone è il <b>sensore</b>.<br>Il prodotto è l'<b>intelligence</b>.</div>
    <div class="dom" style="margin-top:26px">TECNICA + DIRITTO, CON METODO</div>
  </div>
</div>
</body></html>
