<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: #081B31; color: #E8F1F8;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  #sky { position: fixed; inset: 0; z-index: 0; }
  .wrap {
    position: relative; z-index: 2; text-align: center;
    padding: 24px; max-width: 680px; width: 100%;
    animation: fadein 1.4s ease both;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* radar dietro il logo */
  .radar {
    position: relative; width: min(46vw, 260px); height: min(46vw, 260px);
    margin: 0 auto 26px;
  }
  .radar::before {
    content: ''; position: absolute; inset: -22%;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(41,171,226,.0) 0deg, rgba(41,171,226,.0) 300deg, rgba(41,171,226,.35) 360deg);
    animation: sweep 4s linear infinite;
  }
  .radar::after {
    content: ''; position: absolute; inset: -22%;
    border-radius: 50%;
    border: 1px solid rgba(41,171,226,.25);
    box-shadow: inset 0 0 0 1px rgba(41,171,226,.06);
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .ring2 {
    position: absolute; inset: -42%; border-radius: 50%;
    border: 1px dashed rgba(41,171,226,.14);
    animation: slowspin 30s linear infinite;
  }
  @keyframes slowspin { to { transform: rotate(-360deg); } }
  .logo {
    position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 40px rgba(41,171,226,.35), 0 0 110px rgba(41,171,226,.15);
    animation: pulse 3.2s ease-in-out infinite;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 34px rgba(41,171,226,.30), 0 0 90px rgba(41,171,226,.12); }
    50%     { box-shadow: 0 0 60px rgba(41,171,226,.55), 0 0 140px rgba(41,171,226,.22); }
  }

  h1 {
    font-size: clamp(26px, 5.4vw, 44px); font-weight: 800; letter-spacing: 2px;
    line-height: 1.15; margin-bottom: 10px;
  }
  h1 .cyan { color: #29ABE2; }
  .tagline {
    min-height: 1.6em; font-size: clamp(15px, 3vw, 20px); color: #BFD4E6; margin-bottom: 30px;
  }
  .tagline .orange { color: #F7931E; font-weight: 700; }
  .tagline .caret { display: inline-block; width: 2px; height: 1.05em; background: #29ABE2; vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1.5px solid #F7931E; color: #F7931E; border-radius: 999px;
    padding: 10px 22px; font-size: 13px; font-weight: 700; letter-spacing: 3px;
    margin-bottom: 30px; background: rgba(242,101,34,.06);
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #F7931E; animation: blink 1.2s steps(1) infinite; }

  .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 700; font-size: 15px;
    padding: 13px 26px; border-radius: 10px; letter-spacing: .5px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-ig {
    background: linear-gradient(135deg, #29ABE2, #1B7FB8); color: #06141F;
    box-shadow: 0 4px 22px rgba(41,171,226,.35);
  }
  .btn-mail {
    border: 1.5px solid rgba(111,169,206,.5); color: #BFD4E6; background: rgba(255,255,255,.03);
  }
  footer {
    position: fixed; bottom: 16px; left: 0; right: 0; z-index: 2;
    text-align: center; font-size: 11px; letter-spacing: 2px; color: #4A7396;
  }
  @media (max-height: 640px) { .radar { width: 160px; height: 160px; margin-bottom: 16px; } .badge { margin-bottom: 16px; } }

<body>
<canvas id="sky"></canvas>

<div class="wrap">
  <div class="radar">
    <div class="ring2"></div>
    <div class="logo"><img src="logo.jpg" alt="Drone Intelligence Academy — logo"></div>
  </div>

  <h1>DRONE <span class="cyan">INTELLIGENCE</span> ACADEMY</h1>
  <p class="tagline"><span id="type"></span><span class="caret"></span></p>

  <div class="badge"><span class="dot"></span> IN DECOLLO — PRIMI MODULI IN ARRIVO</div>

  <div class="actions">
    <a class="btn btn-ig" href="https://www.instagram.com/droneintelligenceacademy" rel="noopener">Seguici su Instagram →</a>
    <a class="btn btn-mail" href="mailto:info@droneintelligenceacademy.it">info@droneintelligenceacademy.it</a>
  </div>
</div>

<footer>© 2026 DRONE INTELLIGENCE ACADEMY — TECNICA + DIRITTO, CON METODO</footer>

<script>
/* ---- tagline a macchina da scrivere ---- */
const LINES = [
  "Il drone è il sensore. Il prodotto è l'intelligence.",
  "I droni non si imparano a memoria: si indagano.",
  "Tecnica + diritto dei droni, con metodo."
];
const el = document.getElementById('type');
let li = 0, ci = 0, deleting = false;
function type() {
  const line = LINES[li];
  if (!deleting) {
    ci++;
    el.textContent = line.slice(0, ci);
    if (ci === line.length) { deleting = true; return setTimeout(type, 2600); }
    return setTimeout(type, 38 + Math.random() * 40);
  }
  ci--;
  el.textContent = line.slice(0, ci);
  if (ci === 0) { deleting = false; li = (li + 1) % LINES.length; return setTimeout(type, 500); }
  setTimeout(type, 16);
}
type();

/* ---- cielo: stelle + luci di posizione di droni in transito ---- */
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
let W, H, stars = [], drones = [];
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({length: Math.min(160, W * H / 9000)}, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.3 + .2, tw: Math.random() * Math.PI * 2, sp: .003 + Math.random() * .01
  }));
}
addEventListener('resize', resize); resize();

function spawnDrone() {
  const fromLeft = Math.random() < .5;
  drones.push({
    x: fromLeft ? -30 : W + 30, y: H * (.08 + Math.random() * .5),
    vx: (fromLeft ? 1 : -1) * (.4 + Math.random() * .7),
    wob: Math.random() * Math.PI * 2, blink: 0
  });
  setTimeout(spawnDrone, 3500 + Math.random() * 5000);
}
setTimeout(spawnDrone, 1200);

function frame() {
  ctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    s.tw += s.sp;
    ctx.globalAlpha = .25 + .55 * Math.abs(Math.sin(s.tw));
    ctx.fillStyle = '#9FC6E4';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = drones.length - 1; i >= 0; i--) {
    const d = drones[i];
    d.x += d.vx; d.wob += .03; d.blink++;
    const y = d.y + Math.sin(d.wob) * 6;
    ctx.fillStyle = 'rgba(232,241,248,.85)';
    ctx.fillRect(d.x - 3, y, 6, 1.6);
    if (d.blink % 60 < 30) { ctx.fillStyle = '#3ECF8E'; ctx.beginPath(); ctx.arc(d.x - 5, y + 1, 1.6, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#FF6B57'; ctx.beginPath(); ctx.arc(d.x + 5, y + 1, 1.6, 0, 7); ctx.fill(); }
    if (d.x < -60 || d.x > W + 60) drones.splice(i, 1);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
